[package]
name = "veyra-dominion"
version = "0.1.0"
edition = "2021"
license-file = "LICENSE"
publish = false

[dependencies]
macroquad = { version = "0.4.16", features = ["audio"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
